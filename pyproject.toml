[project]
name = "neat-trident"
version = "0.1.0"
description = ""
authors = [
    {name = "arnatoatadaink",email = "yuihout2@gmail.com"}
]
requires-python = "^3.13"
dependencies = [
    "pytest (>=9.0.2,<10.0.0)",
    "numpy (>=2.4.4,<3.0.0)",
    "jax[cpu] (>=0.9.2,<0.10.0)",
    "faiss-cpu (>=1.13.2,<2.0.0) ; python_version >= \"3.13\" and python_version < \"3.15\"",
    "qdax (>=0.5.0,<0.6.0)",
    "torch (>=2.9.0,<3.0.0)"
]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: slow semantic tests using real ML models (run with -m integration)",
]

[[tool.poetry.source]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
priority = "explicit"

[tool.poetry.dependencies]
torch = {source = "pytorch-rocm"}

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
